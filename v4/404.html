<script>
/* 旧サイト（WordPress）URLからのリダイレクト */
(function () {
  var p = location.pathname;
  var en = p.slice(0, 4) === '/en/';
  var path = en ? p.slice(3) : p;
  var last = path.split('/').pop();
  if (last.indexOf('.') !== -1) return; /* 新形式（拡張子付き）URLは404を表示 */
  var root = en ? '/en/' : '/';
  var rules = [
    [/^\/(company|about|profile|corporate|gaiyou|outline)/i, 'company.html'],
    [/^\/(contact|inquiry|otoiawase)/i, 'contact.html'],
    [/^\/(recruit|career|jobs?|saiyo)/i, 'recruit.html'],
    [/^\/(service|consult)/i, 'consulting.html'],
    [/^\/(manufactur|factory|leather|craft)/i, 'manufacturing.html'],
  ];
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0].test(path)) { location.replace(root + rules[i][1]); return; }
  }
  location.replace(root);
})();
</script>
